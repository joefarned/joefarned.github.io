<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Civilization Revolution 2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }

/* Main Layout */
#game-container { display: none; width: 100%; height: 100vh; position: relative; }
#map-canvas { display: block; cursor: pointer; }
#minimap-canvas { position: absolute; bottom: 10px; right: 10px; border: 2px solid #555; background: #111; cursor: pointer; z-index: 10; }

/* Top HUD */
#top-hud { position: absolute; top: 0; left: 0; right: 0; height: 40px; background: linear-gradient(180deg, rgba(20,20,50,0.95), rgba(20,20,50,0.8)); display: flex; align-items: center; padding: 0 15px; z-index: 10; gap: 20px; border-bottom: 1px solid #444; }
.hud-item { display: flex; align-items: center; gap: 5px; font-size: 13px; }
.hud-icon { font-size: 16px; }
.hud-val { color: #ffd700; font-weight: bold; }
#turn-info { margin-left: auto; font-size: 13px; color: #aaa; }

/* Bottom Panel */
#bottom-panel { position: absolute; bottom: 0; left: 0; right: 0; height: 140px; background: linear-gradient(0deg, rgba(15,15,40,0.97), rgba(15,15,40,0.9)); border-top: 1px solid #444; display: flex; z-index: 10; }
#unit-info { width: 220px; padding: 10px; border-right: 1px solid #333; }
#unit-info h3 { font-size: 14px; color: #ffd700; margin-bottom: 5px; }
#unit-info p { font-size: 12px; color: #bbb; line-height: 1.4; }
#action-buttons { flex: 1; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.action-btn { background: linear-gradient(180deg, #3a3a6a, #2a2a4a); border: 1px solid #555; color: #ddd; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
.action-btn:hover { background: linear-gradient(180deg, #5a5a8a, #3a3a6a); border-color: #888; color: #fff; }
.action-btn:active { transform: scale(0.95); }
.action-btn.primary { background: linear-gradient(180deg, #4a6a3a, #2a4a2a); border-color: #6a6; }
.action-btn.primary:hover { background: linear-gradient(180deg, #5a8a4a, #3a6a3a); }
.action-btn.danger { background: linear-gradient(180deg, #6a3a3a, #4a2a2a); border-color: #a66; }

/* End Turn Button */
#end-turn-btn { position: absolute; bottom: 150px; right: 15px; background: linear-gradient(180deg, #8B6914, #6B4914); border: 2px solid #DAA520; color: #fff; padding: 10px 28px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 11; transition: all 0.2s; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
#end-turn-btn:hover { background: linear-gradient(180deg, #AA8934, #8B6914); transform: scale(1.05); }

/* City Screen Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal { background: #1e1e3e; border: 2px solid #555; border-radius: 10px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 20px; }
.modal h2 { color: #ffd700; margin-bottom: 15px; text-align: center; font-size: 20px; }
.modal-close { float: right; background: none; border: none; color: #aaa; font-size: 22px; cursor: pointer; }
.modal-close:hover { color: #fff; }

/* City Details */
.city-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
.city-stat { background: #2a2a4a; padding: 8px; border-radius: 5px; text-align: center; }
.city-stat .label { font-size: 11px; color: #888; }
.city-stat .value { font-size: 18px; font-weight: bold; color: #ffd700; }
.production-queue { margin-top: 10px; }
.prod-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a4a; padding: 8px 12px; margin: 4px 0; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
.prod-item:hover { border-color: #666; background: #3a3a5a; }
.prod-item.selected { border-color: #ffd700; }
.prod-item .name { font-size: 13px; }
.prod-item .cost { font-size: 12px; color: #aaa; }

/* Tech Tree Modal */
.tech-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a4a; padding: 10px 14px; margin: 5px 0; border-radius: 5px; cursor: pointer; border: 1px solid transparent; }
.tech-item:hover { border-color: #666; }
.tech-item.researched { opacity: 0.5; border-color: #4a4; background: #2a3a2a; }
.tech-item.current { border-color: #48f; background: #2a2a4a; }
.tech-item .tech-name { font-weight: bold; font-size: 14px; }
.tech-item .tech-desc { font-size: 11px; color: #aaa; }
.tech-item .tech-cost { font-size: 12px; color: #ffd700; }

/* Title Screen */
#title-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(180deg, #0a0a2e, #1a1a4e, #0a0a2e); }
#title-screen h1 { font-size: 48px; color: #ffd700; text-shadow: 2px 2px 8px rgba(255,215,0,0.4); margin-bottom: 5px; }
#title-screen h2 { font-size: 18px; color: #aaa; margin-bottom: 40px; font-weight: normal; }
.civ-select { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; max-width: 500px; width: 90%; }
.civ-option { background: #2a2a4a; border: 2px solid #444; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.2s; text-align: center; }
.civ-option:hover { border-color: #888; background: #3a3a5a; }
.civ-option.selected { border-color: #ffd700; background: #3a3a2a; }
.civ-option .civ-icon { font-size: 32px; margin-bottom: 5px; }
.civ-option .civ-name { font-weight: bold; font-size: 15px; color: #ffd700; }
.civ-option .civ-bonus { font-size: 11px; color: #aaa; margin-top: 3px; }
#start-btn { background: linear-gradient(180deg, #8B6914, #6B4914); border: 2px solid #DAA520; color: #fff; padding: 14px 50px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
#start-btn:hover { transform: scale(1.05); background: linear-gradient(180deg, #AA8934, #8B6914); }

/* Notifications */
#notifications { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 5px; align-items: center; }
.notification { background: rgba(20,20,50,0.95); border: 1px solid #666; border-radius: 6px; padding: 8px 20px; font-size: 13px; animation: notifIn 0.3s ease, notifOut 0.5s ease 2.5s forwards; white-space: nowrap; }
@keyframes notifIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes notifOut { to { opacity: 0; transform: translateY(-10px); } }

/* Victory Screen */
#victory-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; flex-direction: column; }
#victory-screen.active { display: flex; }
#victory-screen h1 { font-size: 52px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.6); margin-bottom: 10px; }
#victory-screen p { font-size: 20px; color: #ccc; margin-bottom: 30px; }
#victory-screen button { background: linear-gradient(180deg, #8B6914, #6B4914); border: 2px solid #DAA520; color: #fff; padding: 12px 40px; border-radius: 8px; font-size: 18px; cursor: pointer; }

/* Tooltip */
#tooltip { display: none; position: absolute; background: rgba(15,15,40,0.95); border: 1px solid #666; border-radius: 5px; padding: 8px 12px; font-size: 12px; z-index: 60; pointer-events: none; max-width: 220px; }
</style>
</head>
<body>

<!-- Title Screen -->
<div id="title-screen">
  <h1>Mini Civ Rev 2</h1>
  <h2>A Civilization Revolution 2 Tribute</h2>
  <div class="civ-select" id="civ-select"></div>
  <button id="start-btn" onclick="startGame()">Start Game</button>
</div>

<!-- Game Container -->
<div id="game-container">
  <canvas id="map-canvas"></canvas>
  <canvas id="minimap-canvas" width="180" height="180"></canvas>

  <!-- Top HUD -->
  <div id="top-hud">
    <div class="hud-item"><span class="hud-icon">🔬</span> <span id="hud-science" class="hud-val">0</span>/turn</div>
    <div class="hud-item"><span class="hud-icon">💰</span> <span id="hud-gold" class="hud-val">0</span> (<span id="hud-gpt" class="hud-val">+0</span>)</div>

  <div id="notifications"></div>

  <!-- Bottom Panel -->
  <div id="bottom-panel">
    <div id="unit-info">
      <h3 id="selected-name">No Selection</h3>

    </div>
    <div id="action-buttons" id="action-btns"></div>

  <button id="end-turn-btn" onclick="endTurn()">End Turn</button>

</div>

<!-- City Screen Modal -->
<div class="modal-overlay" id="city-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeCityModal()">&times;</button>
    <h2 id="city-modal-name">City</h2>
    <div class="city-stats" id="city-modal-stats"></div>
    <h3 style="color:#ccc;margin-bottom:8px;">Production Queue</h3>
    <div id="city-modal-production"></div>
  </div>
</div>

<!-- Tech Tree Modal -->
<div class="modal-overlay" id="tech-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeTechTree()">&times;</button>
    <h2>Technology Research</h2>
    <div id="tech-tree-list"></div>
  </div>
</div>

<!-- Victory Screen -->
<div id="victory-screen">
  <h1 id="victory-title">Victory!</h1>
  <p id="victory-text"></p>
  <button onclick="location.reload()">Play Again</button>
</div>

<script>
// ============================================================
// GAME CONSTANTS & DATA
// ============================================================
const MAP_W = 40, MAP_H = 30;
const TILE_W = 64, TILE_H = 64;
const CIVS = [
  { id: 'rome', name: 'Rome', icon: '🏛️', color: '#e03030', bonus: '+1 Production in all cities', prodBonus: 1 },
  { id: 'egypt', name: 'Egypt', icon: '🔺', color: '#d4a017', bonus: '+1 Gold in all cities', goldBonus: 1 },
  { id: 'china', name: 'China', icon: '🐉', color: '#e04040', bonus: '+1 Science in all cities', sciBonus: 1 },
  { id: 'england', name: 'England', icon: '👑', color: '#4060c0', bonus: '+1 Naval movement', navalBonus: 1 },
  { id: 'aztec', name: 'Aztec', icon: '☀️', color: '#20a060', bonus: '+1 Combat strength', combatBonus: 1 },
  { id: 'japan', name: 'Japan', icon: '⛩️', color: '#c04080', bonus: '+1 Culture in all cities', cultureBonus: 1 },
];

const TERRAIN = {
  ocean:    { name: 'Ocean',     color: '#1a4a7a', food: 1, prod: 0, gold: 1, move: 1, passable: false, icon: '🌊' },
  coast:    { name: 'Coast',     color: '#2a6a9a', food: 1, prod: 0, gold: 2, move: 1, passable: false, icon: '🌊' },
  grass:    { name: 'Grassland', color: '#4a8c3a', food: 3, prod: 1, gold: 1, move: 1, passable: true, icon: '' },
  plains:   { name: 'Plains',    color: '#8a9a3a', food: 2, prod: 2, gold: 1, move: 1, passable: true, icon: '' },
  desert:   { name: 'Desert',    color: '#c4a44a', food: 0, prod: 1, gold: 1, move: 1, passable: true, icon: '' },
  hills:    { name: 'Hills',     color: '#6a7a3a', food: 1, prod: 3, gold: 1, move: 2, passable: true, defense: 1, icon: '⛰️' },
  mountain: { name: 'Mountain',  color: '#7a7a7a', food: 0, prod: 2, gold: 0, move: 99, passable: false, icon: '🏔️' },
  forest:   { name: 'Forest',    color: '#2a6a2a', food: 2, prod: 2, gold: 1, move: 2, passable: true, defense: 1, icon: '🌲' },
};

const UNIT_TYPES = {
  settler:   { name: 'Settler',    atk: 0, def: 0, hp: 5,  moves: 2, cost: 30, icon: '🏗️', actions: ['found_city'] },
  warrior:   { name: 'Warrior',    atk: 2, def: 2, hp: 10, moves: 2, cost: 10, icon: '⚔️', actions: ['fortify'], tech: null },
  archer:    { name: 'Archer',     atk: 3, def: 1, hp: 8,  moves: 2, cost: 15, icon: '🏹', actions: ['fortify'], tech: 'archery' },
  horseman:  { name: 'Horseman',   atk: 3, def: 1, hp: 10, moves: 3, cost: 20, icon: '🐴', actions: ['fortify'], tech: 'horseback_riding' },
  legion:    { name: 'Legion',     atk: 4, def: 3, hp: 15, moves: 2, cost: 25, icon: '🛡️', actions: ['fortify'], tech: 'iron_working' },
  knight:    { name: 'Knight',     atk: 6, def: 3, hp: 15, moves: 3, cost: 40, icon: '🗡️', actions: ['fortify'], tech: 'chivalry' },
  catapult:  { name: 'Catapult',   atk: 6, def: 1, hp: 8,  moves: 1, cost: 30, icon: '🪨', actions: ['fortify'], tech: 'construction' },
  galley:    { name: 'Galley',     atk: 2, def: 2, hp: 10, moves: 3, cost: 20, icon: '⛵', actions: [], tech: 'sailing', naval: true },
};

const BUILDING_TYPES = {
  granary:     { name: 'Granary',     cost: 20, food: 2, prod: 0, gold: 0, sci: 0, culture: 0, defense: 0, tech: 'pottery', icon: '🌾' },
  barracks:    { name: 'Barracks',    cost: 20, food: 0, prod: 0, gold: 0, sci: 0, culture: 0, defense: 0, tech: null, icon: '⚔️', unitBonus: 1 },
  library:     { name: 'Library',     cost: 25, food: 0, prod: 0, gold: 0, sci: 3, culture: 0, defense: 0, tech: 'writing', icon: '📚' },
  market:      { name: 'Market',      cost: 25, food: 0, prod: 0, gold: 3, sci: 0, culture: 0, defense: 0, tech: 'currency', icon: '🏪' },
  walls:       { name: 'Walls',       cost: 30, food: 0, prod: 0, gold: 0, sci: 0, culture: 0, defense: 4, tech: 'masonry', icon: '🧱' },
  temple:      { name: 'Temple',      cost: 25, food: 0, prod: 0, gold: 0, sci: 0, culture: 3, defense: 0, tech: 'religion', icon: '⛪' },
  workshop:    { name: 'Workshop',    cost: 30, food: 0, prod: 3, gold: 0, sci: 0, culture: 0, defense: 0, tech: 'construction', icon: '🔨' },
  university:  { name: 'University',  cost: 40, food: 0, prod: 0, gold: 0, sci: 5, culture: 0, defense: 0, tech: 'education', icon: '🎓' },
  bank:        { name: 'Bank',        cost: 40, food: 0, prod: 0, gold: 5, sci: 0, culture: 0, defense: 0, tech: 'banking', icon: '🏦' },
  cathedral:   { name: 'Cathedral',   cost: 50, food: 0, prod: 0, gold: 0, sci: 0, culture: 6, defense: 0, tech: 'theology', icon: '⛪' },
};

const TECHS = [
  { id: 'pottery',           name: 'Pottery',           cost: 20,  era: 1, unlocks: 'Granary', prereqs: [] },
  { id: 'archery',           name: 'Archery',           cost: 20,  era: 1, unlocks: 'Archer', prereqs: [] },
  { id: 'writing',           name: 'Writing',           cost: 30,  era: 1, unlocks: 'Library', prereqs: [] },
  { id: 'masonry',           name: 'Masonry',           cost: 30,  era: 1, unlocks: 'Walls', prereqs: ['pottery'] },
  { id: 'sailing',           name: 'Sailing',           cost: 30,  era: 1, unlocks: 'Galley', prereqs: [] },
  { id: 'horseback_riding',  name: 'Horseback Riding',  cost: 35,  era: 1, unlocks: 'Horseman', prereqs: [] },
  { id: 'bronze_working',    name: 'Bronze Working',    cost: 25,  era: 1, unlocks: '', prereqs: [] },
  { id: 'currency',          name: 'Currency',          cost: 40,  era: 2, unlocks: 'Market', prereqs: ['writing'] },
  { id: 'iron_working',      name: 'Iron Working',      cost: 45,  era: 2, unlocks: 'Legion', prereqs: ['bronze_working'] },
  { id: 'construction',      name: 'Construction',      cost: 50,  era: 2, unlocks: 'Workshop, Catapult', prereqs: ['masonry'] },
  { id: 'religion',          name: 'Religion',          cost: 40,  era: 2, unlocks: 'Temple', prereqs: ['writing'] },
  { id: 'mathematics',       name: 'Mathematics',       cost: 50,  era: 2, unlocks: '', prereqs: ['writing', 'currency'] },
  { id: 'education',         name: 'Education',         cost: 60,  era: 3, unlocks: 'University', prereqs: ['mathematics'] },
  { id: 'chivalry',          name: 'Chivalry',          cost: 60,  era: 3, unlocks: 'Knight', prereqs: ['horseback_riding', 'iron_working'] },
  { id: 'banking',           name: 'Banking',           cost: 70,  era: 3, unlocks: 'Bank', prereqs: ['currency', 'mathematics'] },
  { id: 'theology',          name: 'Theology',          cost: 70,  era: 3, unlocks: 'Cathedral', prereqs: ['religion', 'education'] },
  { id: 'gunpowder',         name: 'Gunpowder',         cost: 80,  era: 3, unlocks: '', prereqs: ['iron_working', 'construction'] },
  { id: 'astronomy',         name: 'Astronomy',         cost: 80,  era: 3, unlocks: '', prereqs: ['mathematics', 'sailing'] },
  { id: 'industrialization',  name: 'Industrialization', cost: 100, era: 4, unlocks: '', prereqs: ['banking', 'gunpowder'] },
  { id: 'space_flight',      name: 'Space Flight',      cost: 150, era: 4, unlocks: 'Space Victory', prereqs: ['industrialization', 'astronomy'] },
];

const GREAT_PEOPLE = ['Great Scientist', 'Great Artist', 'Great General', 'Great Merchant'];

// ============================================================
// GAME STATE
// ============================================================
let G = {
  map: [],
  players: [],
  units: [],
  cities: [],
  turn: 1,
  currentPlayer: 0,
  selectedUnit: null,
  selectedCity: null,
  cameraX: 0,
  cameraY: 0,
  gameOver: false,
};

let selectedCivIndex = 0;
let canvas, ctx, minimapCanvas, minimapCtx;
let canvasW, canvasH;
let isDragging = false, dragStartX = 0, dragStartY = 0, camStartX = 0, camStartY = 0;
let animFrame;

// ============================================================
// MAP GENERATION
// ============================================================
function noise(x, y, seed) {
  let n = Math.sin(x * 127.1 + y * 311.7 + seed * 53.3) * 43758.5453;
  return n - Math.floor(n);
}

function smoothNoise(x, y, seed, scale) {
  let sx = x / scale, sy = y / scale;
  let ix = Math.floor(sx), iy = Math.floor(sy);
  let fx = sx - ix, fy = sy - iy;
  let a = noise(ix, iy, seed), b = noise(ix+1, iy, seed);
  let c = noise(ix, iy+1, seed), d = noise(ix+1, iy+1, seed);
  let u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}

function generateMap() {
  let seed = Math.random() * 10000;
  let map = [];
  for (let y = 0; y < MAP_H; y++) {
    map[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      let elev = smoothNoise(x, y, seed, 8) * 0.5 + smoothNoise(x, y, seed + 100, 4) * 0.3 + smoothNoise(x, y, seed + 200, 2) * 0.2;
      let moist = smoothNoise(x, y, seed + 500, 6);

      // Edge ocean bias
      let edgeDist = Math.min(x, y, MAP_W - 1 - x, MAP_H - 1 - y);
      if (edgeDist < 3) elev -= (3 - edgeDist) * 0.15;

      let terrain;
      if (elev < 0.30) terrain = 'ocean';
      else if (elev < 0.37) terrain = 'coast';
      else if (elev > 0.78) terrain = 'mountain';
      else if (elev > 0.68) terrain = 'hills';
      else if (moist > 0.6) terrain = 'forest';
      else if (moist < 0.25) terrain = elev > 0.55 ? 'plains' : 'desert';
      else if (moist < 0.4) terrain = 'plains';
      else terrain = 'grass';

      map[y][x] = { terrain, x, y, visible: false, explored: false, resource: null };
    }
  }
  return map;
}

function findLandSpot(avoidX, avoidY, minDist) {
  for (let tries = 0; tries < 500; tries++) {
    let x = 4 + Math.floor(Math.random() * (MAP_W - 8));
    let y = 4 + Math.floor(Math.random() * (MAP_H - 8));
    if (TERRAIN[G.map[y][x].terrain].passable) {
      if (avoidX !== undefined) {
        let dist = Math.abs(x - avoidX) + Math.abs(y - avoidY);
        if (dist < (minDist || 12)) continue;
      }
      // Check enough land around
      let land = 0;
      for (let dy = -2; dy <= 2; dy++)
        for (let dx = -2; dx <= 2; dx++) {
          let nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H && TERRAIN[G.map[ny][nx].terrain].passable) land++;
        }
      if (land >= 12) return { x, y };
    }
  }
  // Fallback
  for (let y = 5; y < MAP_H - 5; y++)
    for (let x = 5; x < MAP_W - 5; x++)
      if (TERRAIN[G.map[y][x].terrain].passable) return { x, y };
  return { x: MAP_W >> 1, y: MAP_H >> 1 };
}

// ============================================================
// VISIBILITY
// ============================================================
function revealAround(x, y, radius, playerIdx) {
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx*dx + dy*dy > radius*radius + 1) continue;
      let nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H) {
        G.map[ny][nx].explored = true;
        G.map[ny][nx].visible = true;
      }
    }
  }
}

function resetVisibility() {
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++)
      G.map[y][x].visible = false;

  G.units.filter(u => u.owner === 0).forEach(u => revealAround(u.x, u.y, 2));
  G.cities.filter(c => c.owner === 0).forEach(c => revealAround(c.x, c.y, 3));
}

// ============================================================
// PLAYER, UNIT, CITY CREATION
// ============================================================
function createPlayer(civIdx, isHuman) {
  return {
    civ: CIVS[civIdx],
    isHuman,
    gold: 0,
    science: 0,
    culture: 0,
    techs: [],
    currentTech: null,
    techProgress: 0,
    greatPeopleProgress: 0,
    alive: true,
  };
}

let nextUnitId = 1;
function createUnit(type, x, y, owner) {
  let ut = UNIT_TYPES[type];
  let unit = {
    id: nextUnitId++,
    type,
    x, y,
    owner,
    hp: ut.hp,
    maxHp: ut.hp,
    movesLeft: ut.moves,
    maxMoves: ut.moves,
    fortified: false,
    icon: ut.icon,
  };
  G.units.push(unit);
  if (owner === 0) revealAround(x, y, 2);
  return unit;
}

let nextCityId = 1;
const CITY_NAMES = {
  rome: ['Rome','Antium','Cumae','Neapolis','Ravenna','Arretium','Mediolanum','Pisae'],
  egypt: ['Thebes','Memphis','Heliopolis','Giza','Alexandria','Luxor','Karnak','Edfu'],
  china: ["Xi'an","Beijing","Shanghai","Nanjing","Hangzhou","Chengdu","Kaifeng","Luoyang"],
  england: ['London','York','Nottingham','Hastings','Canterbury','Warwick','Oxford','Dover'],
  aztec: ['Tenochtitlan','Texcoco','Tlatelolco','Tlacopan','Coyoacan','Azcapotzalco','Iztapalapa','Chalco'],
  japan: ['Kyoto','Tokyo','Osaka','Nagoya','Nara','Edo','Kamakura','Satsuma'],
};

function createCity(name, x, y, owner) {
  let city = {
    id: nextCityId++,
    name,
    x, y,
    owner,
    population: 1,
    food: 0,
    foodNeeded: 15,
    production: 0,
    producing: null,
    buildings: [],
    defense: 0,
    cultureTotal: 0,
    borderRadius: 1,
  };
  G.cities.push(city);
  if (owner === 0) revealAround(x, y, 3);
  return city;
}

function getCityName(owner) {
  let civ = G.players[owner].civ;
  let names = CITY_NAMES[civ.id] || ['City'];
  let used = G.cities.filter(c => c.owner === owner).map(c => c.name);
  for (let n of names) if (!used.includes(n)) return n;
  return names[0] + ' ' + (used.length + 1);
}

// ============================================================
// YIELDS
// ============================================================
function getCityTiles(city) {
  let tiles = [];
  let r = Math.min(city.borderRadius + 1, 3);
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++) {
      if (Math.abs(dx) + Math.abs(dy) > r + 1) continue;
      let nx = city.x + dx, ny = city.y + dy;
      if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H) tiles.push(G.map[ny][nx]);
    }
  return tiles;
}

function getCityYields(city) {
  let tiles = getCityTiles(city);
  let food = 0, prod = 0, gold = 0, sci = 0, culture = 0;

  tiles.forEach(t => {
    let tr = TERRAIN[t.terrain];
    if (tr.passable || t.terrain === 'coast') {
      food += tr.food;
      prod += tr.prod;
      gold += tr.gold;
    }
  });

  // Population bonus
  food += city.population;
  prod += city.population;

  // Buildings
  city.buildings.forEach(bid => {
    let b = BUILDING_TYPES[bid];
    if (b) { food += b.food; prod += b.prod; gold += b.gold; sci += b.sci; culture += b.culture; }
  });

  // Civ bonuses
  let p = G.players[city.owner];
  if (p.civ.prodBonus) prod += p.civ.prodBonus;
  if (p.civ.goldBonus) gold += p.civ.goldBonus;
  if (p.civ.sciBonus) sci += p.civ.sciBonus;
  if (p.civ.cultureBonus) culture += p.civ.cultureBonus;

  // Base science from pop
  sci += city.population;

  return { food, prod, gold, sci, culture };
}

// ============================================================
// TITLE SCREEN SETUP
// ============================================================
function setupTitleScreen() {
  let sel = document.getElementById('civ-select');
  sel.innerHTML = '';
  CIVS.forEach((c, i) => {
    let div = document.createElement('div');
    div.className = 'civ-option' + (i === selectedCivIndex ? ' selected' : '');
    div.innerHTML = `<div class="civ-icon">${c.icon}</div><div class="civ-name">${c.name}</div><div class="civ-bonus">${c.bonus}</div>`;
    div.onclick = () => { selectedCivIndex = i; setupTitleScreen(); };
    sel.appendChild(div);
  });
}

// ============================================================
// START GAME
// ============================================================
function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game-container').style.display = 'block';

  canvas = document.getElementById('map-canvas');
  ctx = canvas.getContext('2d');
  minimapCanvas = document.getElementById('minimap-canvas');
  minimapCtx = minimapCanvas.getContext('2d');

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Generate map
  G.map = generateMap();

  // Create players
  let humanCiv = selectedCivIndex;
  G.players.push(createPlayer(humanCiv, true));

  // AI opponents (pick 2 random different civs)
  let aiCivs = [];
  while (aiCivs.length < 2) {
    let r = Math.floor(Math.random() * CIVS.length);
    if (r !== humanCiv && !aiCivs.includes(r)) aiCivs.push(r);
  }
  aiCivs.forEach(ci => G.players.push(createPlayer(ci, false)));

  // Place starting units
  let humanSpot = findLandSpot();
  createUnit('settler', humanSpot.x, humanSpot.y, 0);
  createUnit('warrior', humanSpot.x + 1, humanSpot.y, 0);

  G.players.forEach((p, i) => {
    if (i === 0) return;
    let spot = findLandSpot(humanSpot.x, humanSpot.y, 12);
    // AI starts with a city already
    let city = createCity(getCityName(i), spot.x, spot.y, i);
    createUnit('warrior', spot.x + 1, spot.y, i);
    createUnit('warrior', spot.x - 1, spot.y, i);
  });

  // Camera
  G.cameraX = humanSpot.x * TILE_W - canvasW / 2;
  G.cameraY = humanSpot.y * TILE_H - canvasH / 2;

  resetVisibility();
  setupInput();
  updateHUD();
  gameLoop();
}

function resizeCanvas() {
  canvasW = window.innerWidth;
  canvasH = window.innerHeight;
  if (canvas) { canvas.width = canvasW; canvas.height = canvasH; }
}

// ============================================================
// INPUT HANDLING
// ============================================================
function setupInput() {
  canvas.addEventListener('mousedown', e => {
    if (e.button === 0) {
      isDragging = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      camStartX = G.cameraX;
      camStartY = G.cameraY;
    }
  });

  canvas.addEventListener('mousemove', e => {
    if (e.buttons & 1) {
      let dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) isDragging = true;
      if (isDragging) {
        G.cameraX = camStartX - dx;
        G.cameraY = camStartY - dy;
        clampCamera();
      }
    }
    // Tooltip
    updateTooltip(e);
  });

  canvas.addEventListener('mouseup', e => {
    if (!isDragging && e.button === 0) {
      let tx = Math.floor((e.clientX + G.cameraX) / TILE_W);
      let ty = Math.floor((e.clientY + G.cameraY) / TILE_H);
      handleTileClick(tx, ty);
    }
  });

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (G.selectedUnit) {
      let tx = Math.floor((e.clientX + G.cameraX) / TILE_W);
      let ty = Math.floor((e.clientY + G.cameraY) / TILE_H);
      moveUnit(G.selectedUnit, tx, ty);
    }
  });

  // Minimap click
  minimapCanvas.addEventListener('click', e => {
    let rect = minimapCanvas.getBoundingClientRect();
    let mx = (e.clientX - rect.left) / 180 * MAP_W * TILE_W;
    let my = (e.clientY - rect.top) / 180 * MAP_H * TILE_H;
    G.cameraX = mx - canvasW / 2;
    G.cameraY = my - canvasH / 2;
    clampCamera();
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (G.gameOver) return;
    if (e.key === 'Enter' || e.key === 'e') endTurn();
    if (e.key === 'f' && G.selectedUnit) fortifyUnit(G.selectedUnit);
    if (e.key === 'b' && G.selectedUnit && G.selectedUnit.type === 'settler') foundCity(G.selectedUnit);
    if (e.key === 't') openTechTree();
    if (e.key === 'Escape') { closeCityModal(); closeTechTree(); }

    // WASD camera
    let spd = 60;
    if (e.key === 'w' || e.key === 'ArrowUp') G.cameraY -= spd;
    if (e.key === 's' || e.key === 'ArrowDown') G.cameraY += spd;
    if (e.key === 'a' || e.key === 'ArrowLeft') G.cameraX -= spd;
    if (e.key === 'd' || e.key === 'ArrowRight') G.cameraX += spd;
    clampCamera();
  });
}

function clampCamera() {
  G.cameraX = Math.max(-100, Math.min(MAP_W * TILE_W - canvasW + 100, G.cameraX));
  G.cameraY = Math.max(-100, Math.min(MAP_H * TILE_H - canvasH + 100, G.cameraY));
}

function handleTileClick(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return;

  // Check if clicking on own unit
  let unit = G.units.find(u => u.x === tx && u.y === ty && u.owner === 0);
  if (unit) {
    selectUnit(unit);
    return;
  }

  // Check if clicking on own city
  let city = G.cities.find(c => c.x === tx && c.y === ty && c.owner === 0);
  if (city) {
    openCityModal(city);
    return;
  }

  // If unit selected, try to move
  if (G.selectedUnit) {
    moveUnit(G.selectedUnit, tx, ty);
  }
}

// ============================================================
// UNIT ACTIONS
// ============================================================
function selectUnit(unit) {
  G.selectedUnit = unit;
  updateUnitInfo();
  updateActionButtons();
}

function deselectUnit() {
  G.selectedUnit = null;
  updateUnitInfo();
  updateActionButtons();
}

function moveUnit(unit, tx, ty) {
  if (unit.owner !== 0 || unit.movesLeft <= 0) return;
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return;

  let tile = G.map[ty][tx];
  let tr = TERRAIN[tile.terrain];

  // Naval check
  let isNaval = UNIT_TYPES[unit.type].naval;
  if (!isNaval && !tr.passable) return;
  if (isNaval && tr.passable) return;

  let dist = Math.abs(tx - unit.x) + Math.abs(ty - unit.y);
  if (dist > unit.movesLeft + 1) {
    notify("Too far to move this turn!");
    return;
  }
  if (dist > 3) { notify("Move closer first"); return; }

  // Check for enemy units - combat
  let enemy = G.units.find(u => u.x === tx && u.y === ty && u.owner !== unit.owner);
  if (enemy) {
    resolveCombat(unit, enemy);
    unit.movesLeft = 0;
    if (unit.owner === 0) revealAround(unit.x, unit.y, 2);
    updateHUD();
    updateUnitInfo();
    return;
  }

  // Check for enemy city
  let enemyCity = G.cities.find(c => c.x === tx && c.y === ty && c.owner !== unit.owner);
  if (enemyCity) {
    captureCity(unit, enemyCity);
    unit.movesLeft = 0;
    if (unit.owner === 0) revealAround(unit.x, unit.y, 2);
    updateHUD();
    return;
  }

  // Move
  let moveCost = Math.max(1, tr.move || 1);
  if (moveCost > unit.movesLeft && unit.movesLeft < unit.maxMoves) {
    notify("Not enough moves!");
    return;
  }

  unit.x = tx;
  unit.y = ty;
  unit.movesLeft = Math.max(0, unit.movesLeft - moveCost);
  unit.fortified = false;

  if (unit.owner === 0) revealAround(tx, ty, 2);
  updateUnitInfo();
  updateHUD();
}

function fortifyUnit(unit) {
  unit.fortified = true;
  unit.movesLeft = 0;
  notify(UNIT_TYPES[unit.type].name + " fortified");
  updateUnitInfo();
  updateActionButtons();
}

function foundCity(unit) {
  if (unit.type !== 'settler') return;
  let tile = G.map[unit.y][unit.x];
  if (!TERRAIN[tile.terrain].passable) { notify("Cannot found city here!"); return; }

  // Check distance from other cities
  let tooClose = G.cities.some(c => Math.abs(c.x - unit.x) + Math.abs(c.y - unit.y) < 4);
  if (tooClose) { notify("Too close to another city!"); return; }

  let name = getCityName(unit.owner);
  createCity(name, unit.x, unit.y, unit.owner);

  // Remove settler
  G.units = G.units.filter(u => u.id !== unit.id);
  G.selectedUnit = null;

  if (unit.owner === 0) {
    revealAround(unit.x, unit.y, 3);
    notify("🏙️ " + name + " founded!");
  }

  resetVisibility();
  updateHUD();
  updateUnitInfo();
  updateActionButtons();
}

// ============================================================
// COMBAT
// ============================================================
function resolveCombat(attacker, defender) {
  let aType = UNIT_TYPES[attacker.type];
  let dType = UNIT_TYPES[defender.type];
  let atkStr = aType.atk + (G.players[attacker.owner].civ.combatBonus || 0);
  let defStr = dType.def;

  // Terrain defense bonus
  let defTile = G.map[defender.y][defender.x];
  defStr += TERRAIN[defTile.terrain].defense || 0;

  // Fortification bonus
  if (defender.fortified) defStr += 1;

  // City defense bonus
  let defCity = G.cities.find(c => c.x === defender.x && c.y === defender.y && c.owner === defender.owner);
  if (defCity) defStr += 2 + Math.floor(defCity.defense / 2);

  // Barracks bonus
  let atkCity = G.cities.find(c => c.owner === attacker.owner);
  if (atkCity && atkCity.buildings.includes('barracks')) atkStr += 1;

  // Combat rolls
  let atkDmg = Math.max(1, atkStr + Math.floor(Math.random() * 3) - 1);
  let defDmg = Math.max(1, defStr + Math.floor(Math.random() * 3) - 1);

  defender.hp -= atkDmg;
  attacker.hp -= defDmg;

  let atkName = aType.name, defName = dType.name;

  if (defender.hp <= 0 && attacker.hp <= 0) {
    notify("⚔️ " + atkName + " and " + defName + " destroyed each other!");
    G.units = G.units.filter(u => u.id !== attacker.id && u.id !== defender.id);
    if (G.selectedUnit && (G.selectedUnit.id === attacker.id || G.selectedUnit.id === defender.id)) deselectUnit();
  } else if (defender.hp <= 0) {
    notify("⚔️ " + atkName + " defeated " + defName + "!");
    // Attacker moves to defender's position
    attacker.x = defender.x;
    attacker.y = defender.y;
    G.units = G.units.filter(u => u.id !== defender.id);
    if (attacker.owner === 0) revealAround(attacker.x, attacker.y, 2);
  } else if (attacker.hp <= 0) {
    notify("⚔️ " + defName + " repelled " + atkName + "!");
    G.units = G.units.filter(u => u.id !== attacker.id);
    if (G.selectedUnit && G.selectedUnit.id === attacker.id) deselectUnit();
  } else {
    notify("⚔️ " + atkName + " (" + attacker.hp + "hp) vs " + defName + " (" + defender.hp + "hp)");
  }

  checkElimination();
}

function captureCity(unit, city) {
  let oldOwner = city.owner;
  let defenders = G.units.filter(u => u.x === city.x && u.y === city.y && u.owner === oldOwner);

  if (defenders.length > 0) {
    resolveCombat(unit, defenders[0]);
    return;
  }

  // Capture
  city.owner = unit.owner;
  city.population = Math.max(1, city.population - 1);
  unit.x = city.x;
  unit.y = city.y;

  if (unit.owner === 0) {
    notify("🏙️ Captured " + city.name + "!");
    revealAround(city.x, city.y, 3);
  } else if (oldOwner === 0) {
    notify("💀 " + city.name + " was captured by " + G.players[unit.owner].civ.name + "!");
  }

  checkElimination();
  checkDominationVictory();
}

function checkElimination() {
  G.players.forEach((p, i) => {
    if (!p.alive || p.isHuman) return;
    let hasCities = G.cities.some(c => c.owner === i);
    let hasUnits = G.units.some(u => u.owner === i);
    if (!hasCities && !hasUnits) {
      p.alive = false;
      notify("☠️ " + p.civ.name + " has been eliminated!");
    }
  });

  // Check if human eliminated
  let human = G.players[0];
  let hasCities = G.cities.some(c => c.owner === 0);
  let hasUnits = G.units.some(u => u.owner === 0);
  if (!hasCities && !hasUnits) {
    showDefeat();
  }
}

// ============================================================
// VICTORY CONDITIONS
// ============================================================
function checkDominationVictory() {
  let alivePlayers = G.players.filter(p => p.alive);
  // Check if only one player has cities
  let playersWithCities = new Set(G.cities.map(c => c.owner));
  if (playersWithCities.size === 1) {
    let winner = [...playersWithCities][0];
    if (winner === 0) showVictory("Domination Victory!", "You have conquered all rival civilizations!");
    else showDefeat();
  }
}

function checkCultureVictory(playerIdx) {
  if (G.players[playerIdx].culture >= 200) {
    if (playerIdx === 0) showVictory("Cultural Victory!", "Your civilization's culture is legendary!");
    else showDefeat();
  }
}

function checkTechVictory(playerIdx) {
  if (G.players[playerIdx].techs.includes('space_flight')) {
    if (playerIdx === 0) showVictory("Technology Victory!", "You have launched a spacecraft to Alpha Centauri!");
    else showDefeat();
  }
}

function showVictory(title, text) {
  G.gameOver = true;
  document.getElementById('victory-title').textContent = title;
  document.getElementById('victory-text').textContent = text;
  document.getElementById('victory-screen').classList.add('active');
}

function showDefeat() {
  G.gameOver = true;
  document.getElementById('victory-title').textContent = "Defeat";
  document.getElementById('victory-title').style.color = '#ff4444';
  document.getElementById('victory-text').textContent = "Your civilization has fallen...";
  document.getElementById('victory-screen').classList.add('active');
}

// ============================================================
// TURN PROCESSING
// ============================================================
function endTurn() {
  if (G.gameOver) return;

  // Process human cities
  processPlayerTurn(0);

  // Process AI turns
  for (let i = 1; i < G.players.length; i++) {
    if (!G.players[i].alive) continue;
    aiTurn(i);
    processPlayerTurn(i);
  }

  G.turn++;

  // Refresh human units
  G.units.filter(u => u.owner === 0).forEach(u => {
    u.movesLeft = UNIT_TYPES[u.type].moves;
    if (u.hp < UNIT_TYPES[u.type].hp) u.hp = Math.min(UNIT_TYPES[u.type].hp, u.hp + 1); // Heal
  });

  resetVisibility();

  // Auto-select first movable unit
  let movable = G.units.find(u => u.owner === 0 && u.movesLeft > 0 && !u.fortified);
  if (movable) selectUnit(movable); else deselectUnit();

  updateHUD();
}

function processPlayerTurn(playerIdx) {
  let player = G.players[playerIdx];
  let totalGold = 0, totalSci = 0, totalCulture = 0;

  G.cities.filter(c => c.owner === playerIdx).forEach(city => {
    let yields = getCityYields(city);

    // Food & growth
    let foodSurplus = yields.food - city.population * 2;
    city.food += foodSurplus;
    if (city.food >= city.foodNeeded) {
      city.food -= city.foodNeeded;
      city.population++;
      city.foodNeeded = Math.floor(city.foodNeeded * 1.3);
      if (playerIdx === 0) notify("🎉 " + city.name + " grew to pop " + city.population);
    }
    if (city.food < 0) {
      city.food = 0;
      if (city.population > 1) {
        city.population--;
        if (playerIdx === 0) notify("⚠️ " + city.name + " is starving!");
      }
    }

    // Production
    if (city.producing) {
      city.production += yields.prod;
      let item = UNIT_TYPES[city.producing] || BUILDING_TYPES[city.producing];
      if (item && city.production >= item.cost) {
        city.production -= item.cost;
        if (UNIT_TYPES[city.producing]) {
          // Produce unit
          createUnit(city.producing, city.x, city.y, playerIdx);
          if (playerIdx === 0) notify("🏗️ " + city.name + " built " + item.name);
        } else if (BUILDING_TYPES[city.producing]) {
          city.buildings.push(city.producing);
          city.defense += BUILDING_TYPES[city.producing].defense;
          if (playerIdx === 0) notify("🏗️ " + city.name + " built " + item.name);
        }
        city.producing = null;
      }
    }

    // Culture for borders
    city.cultureTotal += yields.culture;
    let borderThreshold = city.borderRadius * city.borderRadius * 20;
    if (city.cultureTotal >= borderThreshold && city.borderRadius < 3) {
      city.borderRadius++;
      if (playerIdx === 0) notify("🎨 " + city.name + " borders expanded!");
    }

    totalGold += yields.gold;
    totalSci += yields.sci;
    totalCulture += yields.culture;
  });

  player.gold += totalGold;
  player.culture += totalCulture;

  // Research
  if (player.currentTech) {
    player.techProgress += totalSci;
    let tech = TECHS.find(t => t.id === player.currentTech);
    if (tech && player.techProgress >= tech.cost) {
      player.techs.push(tech.id);
      player.techProgress = 0;
      if (playerIdx === 0) notify("🔬 Researched " + tech.name + "!");
      player.currentTech = null;
      checkTechVictory(playerIdx);
    }
  }

  // Great People
  player.greatPeopleProgress += totalCulture;
  if (player.greatPeopleProgress >= 100) {
    player.greatPeopleProgress -= 100;
    let gp = GREAT_PEOPLE[Math.floor(Math.random() * GREAT_PEOPLE.length)];
    if (playerIdx === 0) notify("⭐ A " + gp + " has appeared!");
    // Bonus
    if (gp === 'Great Scientist') player.techProgress += 20;
    else if (gp === 'Great Merchant') player.gold += 50;
    else if (gp === 'Great Artist') player.culture += 30;
    else if (gp === 'Great General') {
      // Buff nearby units
      G.units.filter(u => u.owner === playerIdx).forEach(u => { u.hp = Math.min(u.maxHp, u.hp + 3); });
    }
  }

  checkCultureVictory(playerIdx);
}

// ============================================================
// AI
// ============================================================
function aiTurn(playerIdx) {
  let player = G.players[playerIdx];

  // Set research if none
  if (!player.currentTech) {
    let available = TECHS.filter(t => !player.techs.includes(t.id) && t.prereqs.every(p => player.techs.includes(p)));
    if (available.length > 0) {
      player.currentTech = available[Math.floor(Math.random() * available.length)].id;
    }
  }

  // Set city production if none
  G.cities.filter(c => c.owner === playerIdx && !c.producing).forEach(city => {
    let options = [];
    // Units
    Object.entries(UNIT_TYPES).forEach(([id, ut]) => {
      if (!ut.tech || player.techs.includes(ut.tech)) {
        if (id !== 'settler' || G.cities.filter(c => c.owner === playerIdx).length < 4) {
          options.push({ id, priority: id === 'settler' ? 3 : (ut.atk > 0 ? 2 : 1) });
        }
      }
    });
    // Buildings
    Object.entries(BUILDING_TYPES).forEach(([id, bt]) => {
      if ((!bt.tech || player.techs.includes(bt.tech)) && !city.buildings.includes(id)) {
        options.push({ id, priority: 2 });
      }
    });

    if (options.length > 0) {
      // Weight towards military and buildings
      options.sort((a, b) => b.priority - a.priority);
      let pick = options[Math.floor(Math.random() * Math.min(3, options.length))];
      city.producing = pick.id;
    }
  });

  // Move AI units
  G.units.filter(u => u.owner === playerIdx).forEach(unit => {
    unit.movesLeft = UNIT_TYPES[unit.type].moves;

    if (unit.type === 'settler') {
      // Try to find a good city spot
      let bestSpot = null, bestScore = -1;
      for (let tries = 0; tries < 20; tries++) {
        let dx = Math.floor(Math.random() * 11) - 5;
        let dy = Math.floor(Math.random() * 11) - 5;
        let nx = unit.x + dx, ny = unit.y + dy;
        if (nx >= 2 && ny >= 2 && nx < MAP_W - 2 && ny < MAP_H - 2 && TERRAIN[G.map[ny][nx].terrain].passable) {
          let tooClose = G.cities.some(c => Math.abs(c.x - nx) + Math.abs(c.y - ny) < 5);
          if (!tooClose) {
            let score = 0;
            for (let ddy = -1; ddy <= 1; ddy++)
              for (let ddx = -1; ddx <= 1; ddx++) {
                let t = TERRAIN[G.map[ny+ddy]?.[nx+ddx]?.terrain];
                if (t) score += t.food + t.prod;
              }
            if (score > bestScore) { bestScore = score; bestSpot = {x: nx, y: ny}; }
          }
        }
      }
      if (bestSpot && (Math.abs(bestSpot.x - unit.x) <= 1 && Math.abs(bestSpot.y - unit.y) <= 1)) {
        unit.x = bestSpot.x; unit.y = bestSpot.y;
        // Found city
        let name = getCityName(playerIdx);
        createCity(name, unit.x, unit.y, playerIdx);
        G.units = G.units.filter(u => u.id !== unit.id);
        return;
      } else if (bestSpot) {
        aiMoveTowards(unit, bestSpot.x, bestSpot.y);
      }
      return;
    }

    // Military AI - look for targets
    let targetUnit = null, targetDist = 999;
    G.units.filter(u => u.owner !== playerIdx).forEach(u => {
      let d = Math.abs(u.x - unit.x) + Math.abs(u.y - unit.y);
      if (d < targetDist) { targetDist = d; targetUnit = u; }
    });

    let targetCity = null, cityDist = 999;
    G.cities.filter(c => c.owner !== playerIdx).forEach(c => {
      let d = Math.abs(c.x - unit.x) + Math.abs(c.y - unit.y);
      if (d < cityDist) { cityDist = d; targetCity = c; }
    });

    if (targetDist <= 1 && targetUnit && UNIT_TYPES[unit.type].atk > 0) {
      // Attack adjacent enemy
      let enemy = targetUnit;
      resolveCombat(unit, enemy);
      unit.movesLeft = 0;
    } else if (targetDist < 8 && targetUnit && UNIT_TYPES[unit.type].atk > 0) {
      aiMoveTowards(unit, targetUnit.x, targetUnit.y);
    } else if (cityDist < 12 && targetCity && UNIT_TYPES[unit.type].atk > 0) {
      aiMoveTowards(unit, targetCity.x, targetCity.y);
    } else {
      // Wander
      let dx = Math.floor(Math.random() * 3) - 1;
      let dy = Math.floor(Math.random() * 3) - 1;
      let nx = unit.x + dx, ny = unit.y + dy;
      if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H && TERRAIN[G.map[ny][nx].terrain].passable) {
        let occupied = G.units.find(u => u.x === nx && u.y === ny && u.owner === playerIdx);
        if (!occupied) { unit.x = nx; unit.y = ny; }
      }
    }
  });
}

function aiMoveTowards(unit, tx, ty) {
  let best = null, bestDist = 999;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      let nx = unit.x + dx, ny = unit.y + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      let isNaval = UNIT_TYPES[unit.type].naval;
      let tr = TERRAIN[G.map[ny][nx].terrain];
      if (!isNaval && !tr.passable) continue;
      if (isNaval && tr.passable) continue;
      let occupied = G.units.find(u => u.x === nx && u.y === ny && u.owner === unit.owner);
      if (occupied) continue;
      let d = Math.abs(nx - tx) + Math.abs(ny - ty);
      if (d < bestDist) { bestDist = d; best = {x: nx, y: ny}; }
    }
  }
  if (best) { unit.x = best.x; unit.y = best.y; }
}

// ============================================================
// UI UPDATES
// ============================================================
function updateHUD() {
  let player = G.players[0];
  let totalSci = 0, totalGold = 0, totalCulture = 0;
  G.cities.filter(c => c.owner === 0).forEach(c => {
    let y = getCityYields(c);
    totalSci += y.sci; totalGold += y.gold; totalCulture += y.culture;
  });

  document.getElementById('hud-science').textContent = totalSci;
  document.getElementById('hud-gold').textContent = player.gold;
  document.getElementById('hud-gpt').textContent = '+' + totalGold;
  document.getElementById('hud-culture').textContent = player.culture;
  document.getElementById('hud-cities').textContent = G.cities.filter(c => c.owner === 0).length;
  document.getElementById('hud-turn').textContent = G.turn;
  document.getElementById('hud-year').textContent = getYearString(G.turn);

  if (player.currentTech) {
    let tech = TECHS.find(t => t.id === player.currentTech);
    document.getElementById('hud-tech-name').textContent = tech.name;
    document.getElementById('hud-tech-progress').textContent = player.techProgress;
    document.getElementById('hud-tech-cost').textContent = tech.cost;
  } else {
    document.getElementById('hud-tech-name').textContent = 'None (click)';
    document.getElementById('hud-tech-progress').textContent = '0';
    document.getElementById('hud-tech-cost').textContent = '0';
  }
}

function getYearString(turn) {
  if (turn <= 50) return (4000 - turn * 40) + ' BC';
  if (turn <= 100) return ((turn - 50) * 20) + ' AD';
  return (1000 + (turn - 100) * 10) + ' AD';
}

function updateUnitInfo() {
  let nameEl = document.getElementById('selected-name');
  let detailEl = document.getElementById('selected-details');

  if (!G.selectedUnit) {
    nameEl.textContent = 'No Selection';
    detailEl.innerHTML = 'Click a unit to select it<br>Right-click to move selected unit';
    return;
  }

  let u = G.selectedUnit;
  let ut = UNIT_TYPES[u.type];
  nameEl.textContent = ut.icon + ' ' + ut.name;
  detailEl.innerHTML = `HP: ${u.hp}/${ut.hp} | ATK: ${ut.atk} | DEF: ${ut.def}<br>Moves: ${u.movesLeft}/${ut.moves}${u.fortified ? ' | Fortified' : ''}`;
}

function updateActionButtons() {
  let container = document.getElementById('action-buttons');
  container.innerHTML = '';

  if (!G.selectedUnit || G.selectedUnit.owner !== 0) return;
  let u = G.selectedUnit;
  let ut = UNIT_TYPES[u.type];

  if (ut.actions.includes('found_city')) {
    let btn = document.createElement('button');
    btn.className = 'action-btn primary';
    btn.textContent = '🏙️ Found City (B)';
    btn.onclick = () => foundCity(u);
    container.appendChild(btn);
  }

  if (ut.actions.includes('fortify') && !u.fortified) {
    let btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.textContent = '🛡️ Fortify (F)';
    btn.onclick = () => fortifyUnit(u);
    container.appendChild(btn);
  }

  // Skip turn
  let skipBtn = document.createElement('button');
  skipBtn.className = 'action-btn';
  skipBtn.textContent = '⏭️ Skip';
  skipBtn.onclick = () => { u.movesLeft = 0; deselectUnit(); nextUnit(); };
  container.appendChild(skipBtn);
}

function nextUnit() {
  let movable = G.units.find(u => u.owner === 0 && u.movesLeft > 0 && !u.fortified);
  if (movable) selectUnit(movable);
}

// CITY MODAL
// ============================================================
function openCityModal(city) {
  G.selectedCity = city;
  let modal = document.getElementById('city-modal');
  modal.classList.add('active');

  document.getElementById('city-modal-name').textContent = city.name + ' (Pop: ' + city.population + ')';

  let yields = getCityYields(city);
  let statsEl = document.getElementById('city-modal-stats');
  statsEl.innerHTML = `
    <div class="city-stat"><div class="label">Food</div><div class="value">${yields.food}</div></div>
    <div class="city-stat"><div class="label">Production</div><div class="value">${yields.prod}</div></div>
    <div class="city-stat"><div class="label">Gold</div><div class="value">${yields.gold}</div></div>
    <div class="city-stat"><div class="label">Science</div><div class="value">${yields.sci}</div></div>
    <div class="city-stat"><div class="label">Culture</div><div class="value">${yields.culture}</div></div>
    <div class="city-stat"><div class="label">Defense</div><div class="value">${city.defense}</div></div>
  `;

  if (city.buildings.length > 0) {
    statsEl.innerHTML += `<div class="city-stat" style="grid-column: span 3"><div class="label">Buildings</div><div class="value" style="font-size:13px">${city.buildings.map(b => BUILDING_TYPES[b].icon + ' ' + BUILDING_TYPES[b].name).join(', ')}</div></div>`;
  }

  // Production options
  let prodEl = document.getElementById('city-modal-production');
  prodEl.innerHTML = '';

  if (city.producing) {
    let item = UNIT_TYPES[city.producing] || BUILDING_TYPES[city.producing];
    let progress = Math.floor((city.production / item.cost) * 100);
    prodEl.innerHTML += `<div style="margin-bottom:10px;color:#aaa;font-size:13px">Currently producing: <b style="color:#ffd700">${item.name}</b> (${progress}% - ${city.production}/${item.cost})</div>`;
  }

  let player = G.players[city.owner];

  // Units
  prodEl.innerHTML += '<div style="color:#888;font-size:11px;margin:8px 0 4px">UNITS</div>';
  Object.entries(UNIT_TYPES).forEach(([id, ut]) => {
    if (ut.tech && !player.techs.includes(ut.tech)) return;
    let div = document.createElement('div');
    div.className = 'prod-item' + (city.producing === id ? ' selected' : '');
    div.innerHTML = `<span class="name">${ut.icon} ${ut.name} (ATK:${ut.atk} DEF:${ut.def})</span><span class="cost">⚙️ ${ut.cost}</span>`;
    div.onclick = () => { city.producing = id; city.production = city.producing === id ? city.production : 0; openCityModal(city); };
    prodEl.appendChild(div);
  });

  // Buildings
  prodEl.innerHTML += '<div style="color:#888;font-size:11px;margin:8px 0 4px">BUILDINGS</div>';
  Object.entries(BUILDING_TYPES).forEach(([id, bt]) => {
    if (bt.tech && !player.techs.includes(bt.tech)) return;
    if (city.buildings.includes(id)) return;
    let div = document.createElement('div');
    div.className = 'prod-item' + (city.producing === id ? ' selected' : '');
    div.innerHTML = `<span class="name">${bt.icon} ${bt.name}</span><span class="cost">⚙️ ${bt.cost}</span>`;
    div.onclick = () => { city.producing = id; city.production = city.producing === id ? city.production : 0; openCityModal(city); };
    prodEl.appendChild(div);
  });
}

function closeCityModal() {
  document.getElementById('city-modal').classList.remove('active');
  G.selectedCity = null;
}

// ============================================================
// TECH TREE
// ============================================================
function openTechTree() {
  let modal = document.getElementById('tech-modal');
  modal.classList.add('active');

  let list = document.getElementById('tech-tree-list');
  list.innerHTML = '';

  let player = G.players[0];

  // Group by era
  let eras = {1: 'Ancient Era', 2: 'Classical Era', 3: 'Medieval Era', 4: 'Modern Era'};

  Object.entries(eras).forEach(([era, eraName]) => {
    let eraTechs = TECHS.filter(t => t.era === parseInt(era));
    if (eraTechs.length === 0) return;

    list.innerHTML += `<div style="color:#888;font-size:12px;margin:12px 0 6px;border-bottom:1px solid #333;padding-bottom:4px">${eraName}</div>`;

    eraTechs.forEach(tech => {
      let researched = player.techs.includes(tech.id);
      let current = player.currentTech === tech.id;
      let available = !researched && tech.prereqs.every(p => player.techs.includes(p));

      let div = document.createElement('div');
      div.className = 'tech-item' + (researched ? ' researched' : '') + (current ? ' current' : '');
      div.innerHTML = `
        <div>
          <div class="tech-name">${researched ? '✅ ' : current ? '🔬 ' : ''}${tech.name}</div>
          <div class="tech-desc">${tech.unlocks ? 'Unlocks: ' + tech.unlocks : ''} ${tech.prereqs.length > 0 ? '| Requires: ' + tech.prereqs.map(p => TECHS.find(t => t.id === p)?.name).join(', ') : ''}</div>
        </div>
        <div class="tech-cost">${researched ? 'Done' : current ? player.techProgress + '/' + tech.cost : '🔬 ' + tech.cost}</div>
      `;

      if (available && !researched && !current) {
        div.style.cursor = 'pointer';
        div.onclick = () => {
          player.currentTech = tech.id;
          player.techProgress = 0;
          notify("📖 Researching " + tech.name);
          updateHUD();
          openTechTree(); // Refresh
        };
      }

      if (!available && !researched && !current) {
        div.style.opacity = '0.35';
      }

      list.appendChild(div);
    });
  });
}

function closeTechTree() {
  document.getElementById('tech-modal').classList.remove('active');
}

// TOOLTIP
// ============================================================
function updateTooltip(e) {
  let tooltip = document.getElementById('tooltip');
  let tx = Math.floor((e.clientX + G.cameraX) / TILE_W);
  let ty = Math.floor((e.clientY + G.cameraY) / TILE_H);

  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H || !G.map[ty][tx].explored) {
    tooltip.style.display = 'none';
    return;
  }

  let tile = G.map[ty][tx];
  let tr = TERRAIN[tile.terrain];
  let text = `<b>${tr.name}</b><br>Food: ${tr.food} | Prod: ${tr.prod} | Gold: ${tr.gold}`;

  let unit = G.units.find(u => u.x === tx && u.y === ty);
  if (unit && tile.visible) {
    let ut = UNIT_TYPES[unit.type];
    let owner = G.players[unit.owner];
    text += `<br><br>${ut.icon} <b>${ut.name}</b> (${owner.civ.name})<br>HP: ${unit.hp}/${ut.hp} | ATK: ${ut.atk} | DEF: ${ut.def}`;
  }

  let city = G.cities.find(c => c.x === tx && c.y === ty);
  if (city && tile.visible) {
    let owner = G.players[city.owner];
    text += `<br><br>🏙️ <b>${city.name}</b> (${owner.civ.name})<br>Pop: ${city.population} | Def: ${city.defense}`;
  }

  tooltip.innerHTML = text;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 15) + 'px';
  tooltip.style.top = (e.clientY + 15) + 'px';
}

// ============================================================
// RENDERING
// ============================================================
function gameLoop() {
  if (G.gameOver) return;
  render();
  renderMinimap();
  animFrame = requestAnimationFrame(gameLoop);
}

function render() {
  ctx.fillStyle = '#0a0a1e';
  ctx.fillRect(0, 0, canvasW, canvasH);

  let startX = Math.max(0, Math.floor(G.cameraX / TILE_W) - 1);
  let startY = Math.max(0, Math.floor(G.cameraY / TILE_H) - 1);
  let endX = Math.min(MAP_W, Math.ceil((G.cameraX + canvasW) / TILE_W) + 1);
  let endY = Math.min(MAP_H, Math.ceil((G.cameraY + canvasH) / TILE_H) + 1);

  // Draw tiles
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      let tile = G.map[y][x];
      let sx = x * TILE_W - G.cameraX;
      let sy = y * TILE_H - G.cameraY;

      if (!tile.explored) {
        ctx.fillStyle = '#0a0a1e';
        ctx.fillRect(sx, sy, TILE_W, TILE_H);
        continue;
      }

      let tr = TERRAIN[tile.terrain];
      ctx.fillStyle = tile.visible ? tr.color : darken(tr.color, 0.4);
      ctx.fillRect(sx, sy, TILE_W, TILE_H);

      // Grid lines
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.strokeRect(sx, sy, TILE_W, TILE_H);

      // Terrain icon
      if (tr.icon && tile.visible) {
        ctx.font = '20px serif';
        ctx.textAlign = 'center';
        ctx.fillText(tr.icon, sx + TILE_W/2, sy + TILE_H/2 + 6);
      }
    }
  }

  // Draw city borders
  G.cities.forEach(city => {
    let player = G.players[city.owner];
    let r = city.borderRadius + 1;
    ctx.strokeStyle = player.civ.color + '66';
    ctx.lineWidth = 2;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) + Math.abs(dy) > r + 1) continue;
        let nx = city.x + dx, ny = city.y + dy;
        if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H && G.map[ny][nx].explored) {
          let sx = nx * TILE_W - G.cameraX;
          let sy = ny * TILE_H - G.cameraY;
          ctx.strokeRect(sx + 1, sy + 1, TILE_W - 2, TILE_H - 2);
        }
      }
    }
    ctx.lineWidth = 1;
  });

  // Draw cities
  G.cities.forEach(city => {
    let tile = G.map[city.y][city.x];
    if (!tile.visible && !tile.explored) return;

    let sx = city.x * TILE_W - G.cameraX;
    let sy = city.y * TILE_H - G.cameraY;
    let player = G.players[city.owner];

    let alpha = tile.visible ? 1 : 0.5;

    // City background
    ctx.fillStyle = player.civ.color + (tile.visible ? 'cc' : '66');
    ctx.fillRect(sx + 4, sy + 4, TILE_W - 8, TILE_H - 8);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 4, sy + 4, TILE_W - 8, TILE_H - 8);
    ctx.lineWidth = 1;

    // City icon
    ctx.font = '24px serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = alpha;
    ctx.fillText('🏙️', sx + TILE_W/2, sy + TILE_H/2 + 4);
    ctx.globalAlpha = 1;

    // City name and pop
    ctx.font = 'bold 11px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(city.name, sx + TILE_W/2, sy - 4);

    // Population badge
    ctx.fillStyle = player.civ.color;
    ctx.beginPath();
    ctx.arc(sx + TILE_W - 8, sy + 10, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText(city.population, sx + TILE_W - 8, sy + 14);

    // Production icon
    if (city.producing && city.owner === 0) {
      let item = UNIT_TYPES[city.producing] || BUILDING_TYPES[city.producing];
      if (item) {
        ctx.font = '14px serif';
        ctx.fillText(item.icon || '⚙️', sx + 10, sy + TILE_H - 6);
      }
    }
  });

  // Draw units
  G.units.forEach(unit => {
    let tile = G.map[unit.y][unit.x];
    if (!tile.visible) return;

    let sx = unit.x * TILE_W - G.cameraX;
    let sy = unit.y * TILE_H - G.cameraY;
    let player = G.players[unit.owner];

    // Unit circle background
    ctx.fillStyle = player.civ.color + 'cc';
    ctx.beginPath();
    ctx.arc(sx + TILE_W/2, sy + TILE_H/2, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.lineWidth = 1;

    // Unit icon
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.fillText(unit.icon, sx + TILE_W/2, sy + TILE_H/2 + 7);

    // HP bar
    let hpPct = unit.hp / unit.maxHp;
    let barW = 30, barH = 3;
    let bx = sx + TILE_W/2 - barW/2, by = sy + TILE_H/2 + 14;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = hpPct > 0.6 ? '#4a4' : hpPct > 0.3 ? '#aa4' : '#a44';
    ctx.fillRect(bx, by, barW * hpPct, barH);

    // Selected highlight
    if (G.selectedUnit && G.selectedUnit.id === unit.id) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx + TILE_W/2, sy + TILE_H/2, 20, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1;

      // Movement range indicator
      if (unit.movesLeft > 0) {
        ctx.fillStyle = 'rgba(255,215,0,0.1)';
        let range = unit.movesLeft;
        for (let dy = -range; dy <= range; dy++) {
          for (let dx = -range; dx <= range; dx++) {
            if (Math.abs(dx) + Math.abs(dy) > range) continue;
            let nx = unit.x + dx, ny = unit.y + dy;
            if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H && (dx !== 0 || dy !== 0)) {
              let t = TERRAIN[G.map[ny][nx].terrain];
              let isNaval = UNIT_TYPES[unit.type].naval;
              if ((!isNaval && t.passable) || (isNaval && !t.passable && G.map[ny][nx].terrain !== 'mountain')) {
                ctx.fillRect(nx * TILE_W - G.cameraX, ny * TILE_H - G.cameraY, TILE_W, TILE_H);
              }
            }
          }
        }
      }
    }

    // Fortified indicator
    if (unit.fortified) {
      ctx.font = '10px serif';
      ctx.fillText('🛡️', sx + TILE_W - 10, sy + TILE_H - 6);
    }
  });
}

function renderMinimap() {
  let mw = 180, mh = 180;
  let sx = mw / MAP_W, sy = mh / MAP_H;

  minimapCtx.fillStyle = '#0a0a1e';
  minimapCtx.fillRect(0, 0, mw, mh);

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      let tile = G.map[y][x];
      if (!tile.explored) continue;
      minimapCtx.fillStyle = TERRAIN[tile.terrain].color;
      minimapCtx.fillRect(x * sx, y * sy, sx + 0.5, sy + 0.5);
    }
  }

  // Draw cities on minimap
  G.cities.forEach(city => {
    if (!G.map[city.y][city.x].explored) return;
    minimapCtx.fillStyle = G.players[city.owner].civ.color;
    minimapCtx.fillRect(city.x * sx - 1, city.y * sy - 1, sx + 2, sy + 2);
  });

  // Draw units on minimap
  G.units.filter(u => u.owner === 0).forEach(u => {
    minimapCtx.fillStyle = '#fff';
    minimapCtx.fillRect(u.x * sx, u.y * sy, sx, sy);
  });

  // Camera viewport
  minimapCtx.strokeStyle = '#ffd700';
  minimapCtx.lineWidth = 1;
  let vx = G.cameraX / (MAP_W * TILE_W) * mw;
  let vy = G.cameraY / (MAP_H * TILE_H) * mh;
  let vw = canvasW / (MAP_W * TILE_W) * mw;
  let vh = canvasH / (MAP_H * TILE_H) * mh;
  minimapCtx.strokeRect(vx, vy, vw, vh);
}

function darken(hex, factor) {
  let r = parseInt(hex.slice(1,3), 16) * factor;
  let g = parseInt(hex.slice(3,5), 16) * factor;
  let b = parseInt(hex.slice(5,7), 16) * factor;
  return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
}

</script>
